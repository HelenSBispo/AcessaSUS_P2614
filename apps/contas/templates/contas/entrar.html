{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block conteudo %}
<div class="cartao cartao-estreito">
  <h1>Entrar</h1>
  <p>Acesso restrito a usuários cadastrados (Auditor ou Gestor de TI).</p>
  <form method="post" novalidate>
    {% csrf_token %}
    {% include "_form_erros.html" %}
    {{ form.username.as_field_group }}
    {{ form.password.as_field_group }}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="botao botao-primario">Entrar</button>
  </form>
</div>
{% endblock %}
