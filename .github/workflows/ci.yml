name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint e formatação (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  testes:
    name: Testes (pytest + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: acessasus_test
          POSTGRES_USER: acessasus
          POSTGRES_PASSWORD: acessasus
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U acessasus" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_DB: acessasus_test
      POSTGRES_USER: acessasus
      POSTGRES_PASSWORD: acessasus
      POSTGRES_HOST: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Bibliotecas do WeasyPrint
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 fonts-dejavu-core
      - run: pip install -r requirements-dev.txt
      - name: Migrações completas
        run: python manage.py makemigrations --check --dry-run --settings=config.settings_test
      - name: Testes unitários e de integração
        run: pytest -m "not e2e" --cov --cov-report=term-missing --cov-report=xml --junitxml=test-results/junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-testes
          path: |
            test-results/
            coverage.xml

  acessibilidade:
    name: Acessibilidade (axe-core + Playwright)
    runs-on: ubuntu-latest
    needs: testes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Bibliotecas do WeasyPrint
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 fonts-dejavu-core
      - run: pip install -r requirements-dev.txt
      - run: playwright install --with-deps chromium
      - run: pytest -m e2e

  docker:
    name: Build da imagem Docker
    runs-on: ubuntu-latest
    needs: testes
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t acessasus:ci .
